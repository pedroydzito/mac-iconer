name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 1.0.0). Deixe vazio para só compilar."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        run: ./build.sh "$VERSION"

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Renicon
          path: |
            build/Renicon.dmg
            build/Renicon.zip

      - name: Publicar release
        if: env.PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Renicon ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/Renicon.dmg
            build/Renicon.zip
          generate_release_notes: true
